<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8f4">
<title>Mi lista · Compra y para llevar</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172c20;background:#f4f8f4;font-size:17px}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px calc(26px + env(safe-area-inset-bottom))}.app{max-width:620px;margin:auto}header{position:sticky;top:0;z-index:5;background:#f4f8f4eF;backdrop-filter:blur(9px);padding:15px 2px 11px;border-bottom:1px solid #d9e5da}h1{margin:0 0 6px;font-size:1.55rem}.sub{color:#567063;font-size:.88rem}.progress{height:9px;background:#dae8dc;border-radius:20px;overflow:hidden;margin-top:11px}.progress>span{display:block;background:#399763;height:100%;width:0%;transition:width .2s}.toolbar{display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap}.pill,.button{border:1px solid #bfd4c4;background:white;color:#20432d;border-radius:12px;padding:10px 12px;font-weight:650;cursor:pointer;font-size:.91rem}.pill.active{background:#dbefdf;border-color:#5caa76}.button.primary{background:#277b4e;color:white;border-color:#277b4e}.button.danger{color:#a12f2f;border-color:#e8b9b9}.add{margin:16px 0;background:white;border:1px solid #d8e8da;box-shadow:0 4px 20px #234b2a0b;border-radius:18px;padding:15px}h2{margin:0 0 12px;font-size:1.15rem}.add-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}.add input,.add select{width:100%;min-width:0;border:1px solid #bfcfc2;border-radius:12px;padding:13px 11px;background:white;color:#1a3426;font:inherit;font-size:1rem}.add select{margin-bottom:10px}.add input:focus,.add select:focus{outline:2px solid #519d6b;outline-offset:1px}.section{background:white;border:1px solid #d8e8da;border-radius:18px;margin:16px 0;overflow:hidden}.section h2{display:flex;justify-content:space-between;align-items:center;background:#e6f1e8;padding:14px;margin:0}.count{font-size:.78rem;background:#fff;padding:5px 9px;border-radius:20px;color:#396548}.items{padding:1px 12px}.item{display:flex;align-items:center;gap:12px;min-height:51px;border-bottom:1px solid #eef3ee}.item:last-child{border-bottom:none}.item input[type=checkbox]{appearance:none;flex:none;width:25px;height:25px;border:2px solid #639476;border-radius:7px;margin:0;cursor:pointer;background:white;position:relative}.item input[type=checkbox]:checked{background:#32925d;border-color:#32925d}.item input[type=checkbox]:checked:after{content:'✓';color:white;font-size:19px;position:absolute;left:3px;top:-3px;font-weight:800}.item label{flex:1;padding:13px 0;cursor:pointer;overflow-wrap:anywhere}.item.done label{text-decoration:line-through;color:#81958a}.delete{border:0;background:#fff1f0;color:#ae4640;border-radius:9px;width:35px;height:35px;font-size:23px;line-height:1;cursor:pointer;flex:none}.empty{padding:17px;color:#758578;text-align:center}.foot{font-size:.79rem;color:#5f7566;line-height:1.5;padding:5px 4px 20px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:370px){.toolbar .pill{flex:1}.add-row{grid-template-columns:1fr}.button.primary{width:100%}}
</style>
</head>
<body><div class="app">
<header><h1>🛒 Mi lista</h1><div class="sub" id="status">0 de 0 completados</div><div class="progress" aria-label="Progreso"><span id="bar"></span></div><div class="toolbar"><button class="pill" id="toggleDone" aria-pressed="false">Ocultar marcados</button><button class="pill" id="reset">Desmarcar todo</button></div></header>
<form class="add" id="addForm"><h2>➕ Añadir producto o cosa</h2><label class="visually-hidden" for="category">Categoría</label><select id="category"><option value="food">🥑 Comida y bebida</option><option value="carry">🧳 Para llevar</option></select><div class="add-row"><label class="visually-hidden" for="newItem">Nombre del producto o cosa</label><input id="newItem" placeholder="Ej.: Manzanas, paraguas…" maxlength="100" required autocomplete="off"><button class="button primary" type="submit">Añadir</button></div></form>
<div id="sections"></div><div class="foot">Toca la casilla para marcar un artículo. Pulsa ✕ para eliminarlo. Los cambios se guardan automáticamente en este navegador y dispositivo. Si borras los datos del navegador, puedes perder la lista.</div>
</div>
<script>
(()=>{'use strict';
const KEY='lista-movil-personalizable-v1';
const initial=[
{key:'food',title:'🥑 Comida y bebida',items:['Agua','Aceite','Café','Cafetera','Bebida','Bebida vegetal de almendra','Avellanas','Almendras crudas','Pistachos','Pipas','Vinagre','Sal','Olivas','Ajos','Ajetes congelados','Limón','Espárragos','Lechuga','Verduras','Huevos','Caldo congelado','Carne','Latas','Bacon','Tomates','Aguacate','Fresas congeladas','Yogures','Yogures de cabra','Actimel','Noodles','Pescado congelado','Chocolate del 99','Fruta variada','Infusión y filtro','Melba']},
{key:'carry',title:'🧳 Para llevar',items:['Lino del pelo','Sartén para tortillas','Dinero','Calefactor para el baño','Ladrón de enchufe','Cargadores','Esterilla de yoga','Mechero','Suplementos y medicamentos']}
];
const fresh=()=>initial.flatMap(s=>s.items.map((name,i)=>({id:s.key+'-'+i,name,category:s.key,done:false})));
let items;try{let saved=JSON.parse(localStorage.getItem(KEY));items=Array.isArray(saved)&&saved.every(i=>i&&typeof i.id==='string'&&typeof i.name==='string'&&['food','carry'].includes(i.category))?saved:fresh()}catch(e){items=fresh()}
let hidden=false;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('No se pudo guardar automáticamente. Comprueba que el navegador permite almacenamiento local.')}};
function render(){const n=items.filter(i=>i.done).length; $('status').textContent=`${n} de ${items.length} completados`; $('bar').style.width=(items.length?100*n/items.length:0)+'%';$('toggleDone').textContent=hidden?'Mostrar marcados':'Ocultar marcados';$('toggleDone').classList.toggle('active',hidden);$('toggleDone').setAttribute('aria-pressed',String(hidden));const wrap=$('sections');wrap.replaceChildren();for(const group of initial){const sec=document.createElement('section');sec.className='section';const header=document.createElement('h2');header.append(document.createTextNode(group.title));const count=document.createElement('span');count.className='count';let groupItems=items.filter(i=>i.category===group.key);count.textContent=`${groupItems.filter(i=>i.done).length}/${groupItems.length}`;header.append(count);sec.append(header);const content=document.createElement('div');content.className='items';const visible=hidden?groupItems.filter(i=>!i.done):groupItems;if(!visible.length){const msg=document.createElement('p');msg.className='empty';msg.textContent=groupItems.length?'¡Todo completado!':'No hay artículos todavía';content.append(msg)}for(const item of visible){const row=document.createElement('div');row.className='item'+(item.done?' done':'');const box=document.createElement('input');box.type='checkbox';box.checked=!!item.done;box.id='item-'+item.id;box.setAttribute('aria-label','Marcar '+item.name);box.addEventListener('change',()=>{item.done=box.checked;save();render()});const label=document.createElement('label');label.htmlFor=box.id;label.textContent=item.name;const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='×';del.setAttribute('aria-label','Eliminar '+item.name);del.addEventListener('click',()=>{if(confirm('¿Eliminar «'+item.name+'» de la lista?')){items=items.filter(x=>x.id!==item.id);save();render()}});row.append(box,label,del);content.append(row)}sec.append(content);wrap.append(sec)}}
$('addForm').addEventListener('submit',e=>{e.preventDefault();const input=$('newItem');const name=input.value.trim().replace(/\s+/g,' ');if(!name)return;const category=$('category').value;items.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name,category,done:false});save();hidden=false;input.value='';render();input.focus()});$('toggleDone').addEventListener('click',()=>{hidden=!hidden;render()});$('reset').addEventListener('click',()=>{if(!items.some(i=>i.done))return;if(confirm('¿Desmarcar todos los artículos?')){items.forEach(i=>i.done=false);save();render()}});render();
})();
</script></body></html>
